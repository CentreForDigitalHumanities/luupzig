@for (token of tokens; track token; let tokenIndex = $index) {
  <div
    class="cell"
    [class.is-italic]="type === 'example'"
    (mouseout)="emitHover(-1, -1)"
  >
    <div class="token">
      @for (part of token.parts; track part) {
        <span class="part" [class.is-highlight]="part.highlight">
          @for (segment of part.segments; track segment) {
            @if (!segment.whitespace) {
              <span
                class="segment"
                [class.is-small-caps]="segment.smallCaps"
                [class.is-hovered]="
                  hoveredSegment !== -1 &&
                  tokenIndex === hoveredToken &&
                  segment.index === hoveredSegment
                "
                (mouseover)="emitHover(tokenIndex, segment.index)"
                ><span class="text">{{ segment.text }}</span></span
              >
            }
          }
        </span>
      }
    </div>
  </div>
}
